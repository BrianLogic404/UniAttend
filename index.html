<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusAttend — University Attendance Portal</title>
<style>
:root{--navy:#14243d;--navy2:#203657;--blue:#315ee8;--bg:#f4f6fa;--line:#e3e8f0;--muted:#68768c;--green:#16845b;--amber:#996400;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#19263b;font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--navy);color:#eaf0fb;padding:24px 15px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{height:38px;width:38px;border-radius:11px;background:#416af0;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:16px}.brand small{color:#a9b8d1;font-size:11px}.label{font-size:10px;letter-spacing:1.2px;color:#91a4c1;font-weight:800;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{border:0;background:none;color:#c7d2e4;text-align:left;border-radius:9px;padding:12px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#2a4165;color:white}.ico{width:18px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #344765;padding:16px 10px 0;color:#a9b8d1;font-size:12px}.main{min-width:0}.topbar{height:74px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}.crumb{font-size:11px;color:var(--muted)}.pagetitle{font-weight:750;font-size:18px}.right{display:flex;align-items:center;gap:11px}.role{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:white}.avatar{width:36px;height:36px;border-radius:50%;background:#e0e8ff;color:#294fc7;display:grid;place-items:center;font-weight:800}.content{max-width:1500px;padding:27px 30px 40px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:start;gap:14px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:1.1px;font-weight:800;color:var(--blue);margin-bottom:7px}.welcome h1{font-size:26px;letter-spacing:-.5px;margin:0}.welcome p{color:var(--muted);margin:7px 0 0}.date{background:white;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:#536178;white-space:nowrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 6px 22px #192d4b08;overflow:hidden}.stat{padding:18px}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.staticon{width:33px;height:33px;border-radius:10px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-size:17px}.number{font-size:28px;font-weight:800;margin:13px 0 4px}.note{font-size:11px;color:var(--muted)}.cols{grid-template-columns:minmax(0,1.4fr) minmax(280px,.85fr);align-items:start}.head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.ptitle{font-size:14px;font-weight:750}.sub{font-size:11px;color:var(--muted);margin-top:4px}.body{padding:18px 19px}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:white;color:#3b4960;font-weight:650}.btn:hover{background:#f7f9fc}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:#b42335}.btn.sm{font-size:11px;padding:7px 9px}.courses{display:grid;gap:11px}.course{border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.courseleft{display:flex;align-items:center;gap:11px;min-width:0}.coursecode{width:42px;height:42px;border-radius:10px;background:#edf2ff;color:#3456bd;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}.course h3{font-size:12px;margin:0 0 4px}.course p{font-size:10px;color:var(--muted);margin:0}.progress{height:5px;background:#edf0f5;border-radius:9px;margin-top:8px;overflow:hidden}.progress span{height:100%;display:block;background:var(--blue)}.badge{display:inline-block;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:750;white-space:nowrap}.greenbg{background:#e8f7f0;color:var(--green)}.amberbg{background:#fff4d9;color:var(--amber)}.bluebg{background:#edf2ff;color:var(--blue)}.graybg{background:#edf0f4;color:#59677b}.activityrow{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.activityrow:last-child{border-bottom:0}.dot{width:8px;height:8px;border-radius:50%;background:#5476ec;margin-top:5px;flex-shrink:0}.activityrow strong{display:block;font-size:11px}.activityrow span{font-size:10px;color:var(--muted)}.section{display:none}.section.active{display:block}.notice{background:#f4f7ff;border:1px solid #dce6ff;color:#35518b;border-radius:9px;padding:12px;font-size:11px;line-height:1.6}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:12px 15px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}th{background:#fafbfd;color:#66748a;font-size:9px;letter-spacing:.6px;text-transform:uppercase}tbody tr:last-child td{border-bottom:0}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:650;color:#536178}.field input,.field select{width:100%;border:1px solid #d9e0eb;border-radius:8px;padding:10px;background:white}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.codebox{border:1px dashed #9bafea;background:#f4f7ff;border-radius:11px;padding:20px;text-align:center}.code{font-size:34px;letter-spacing:8px;color:#244bd0;font-weight:850;margin:12px 0}.muted{color:var(--muted)}.empty{text-align:center;padding:25px;color:var(--muted)}.footer{font-size:10px;color:var(--muted);margin-top:14px}.profile{display:flex;gap:14px;align-items:center;padding:19px}.profileicon{height:56px;width:56px;border-radius:14px;background:#e3eaff;display:grid;place-items:center;color:#294bc1;font-size:19px;font-weight:800}.profile h2{font-size:16px;margin:0 0 5px}.profile p{font-size:11px;color:var(--muted);margin:0}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:white;border-radius:9px;padding:12px 16px;z-index:50;box-shadow:0 8px 24px #0002}.hidden{display:none!important}.mobile{display:none}
@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.content{padding:22px 18px}.topbar{padding:0 18px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;z-index:20;top:0;bottom:0;left:-260px;width:245px;transition:left .2s;box-shadow:0 5px 30px #0002}.sidebar.open{left:0}.mobile{display:inline-block}.topbar{height:65px;padding:0 13px}.pagetitle{font-size:15px}.content{padding:19px 12px 30px}.welcome{display:block}.welcome h1{font-size:22px}.date{display:inline-block;margin-top:12px}.stats{gap:9px}.stat{padding:13px}.number{font-size:23px}.stathead{font-size:10px}.role{font-size:11px;padding:8px;max-width:125px}.right{gap:7px}.head,.body{padding:14px}.course{align-items:flex-start}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.cols{gap:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">CA</div><div><strong>CampusAttend</strong><small>University attendance portal</small></div></div><div><div class="label">WORKSPACE</div><nav class="nav" id="nav"></nav></div><div class="sidefoot"><strong>CampusAttend</strong><br>Attendance made accountable.<br><span id="sideRole">Student workspace</span></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:11px"><button class="btn mobile" id="menuBtn">☰</button><div><div class="crumb">University portal / <span id="crumb">Overview</span></div><div class="pagetitle" id="pagetitle">Overview</div></div></div><div class="right"><select class="role" id="role"><option value="student">Student view</option><option value="lecturer">Lecturer view</option></select><div class="avatar" id="avatar">BO</div></div></header>
<div class="content"><div class="welcome"><div><div class="eyebrow" id="eyebrow">STUDENT DASHBOARD</div><h1 id="welcome">Good morning, Brian</h1><p id="welcomeText">Track your attendance and stay up to date with your classes.</p></div><div class="date" id="date"></div></div>
<section class="section active" id="sec-overview"></section><section class="section" id="sec-courses"></section><section class="section" id="sec-attendance"></section><section class="section" id="sec-sessions"></section><section class="section" id="sec-roster"></section><section class="section" id="sec-profile"></section></div></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const S={role:'student',page:'overview',session:null,courses:[
{code:'HRM 210',name:'Human Resource Management',lecturer:'Dr. Alice Wanjiku',year:'Year 2',semester:'Semester 1',attendance:92,present:12,total:13},
{code:'ICT 204',name:'Information Systems',lecturer:'Mr. David Otieno',year:'Year 2',semester:'Semester 1',attendance:85,present:11,total:13},
{code:'BUS 216',name:'Business Communication',lecturer:'Ms. Grace Achieng',year:'Year 2',semester:'Semester 1',attendance:100,present:12,total:12},
{code:'STA 202',name:'Business Statistics',lecturer:'Mr. Peter Mwangi',year:'Year 2',semester:'Semester 1',attendance:77,present:10,total:13}],
records:[
{date:'2026-10-16',code:'HRM 210',unit:'Human Resource Management',time:'08:00–10:00',status:'Present'},
{date:'2026-10-15',code:'ICT 204',unit:'Information Systems',time:'10:00–12:00',status:'Present'},
{date:'2026-10-14',code:'STA 202',unit:'Business Statistics',time:'14:00–16:00',status:'Absent'},
{date:'2026-10-13',code:'BUS 216',unit:'Business Communication',time:'12:00–14:00',status:'Present'},
{date:'2026-10-12',code:'HRM 210',unit:'Human Resource Management',time:'08:00–10:00',status:'Present'}],
students:[
{adm:'RUC/2024/001',name:'Brian Otieno',programme:'Human Resource Management',year:'Year 2',status:'Present',time:'08:42'},
{adm:'RUC/2024/014',name:'Faith Atieno',programme:'Human Resource Management',year:'Year 2',status:'Present',time:'08:43'},
{adm:'RUC/2024/026',name:'Kevin Omondi',programme:'Human Resource Management',year:'Year 2',status:'Present',time:'08:45'},
{adm:'RUC/2024/031',name:'Mercy Akinyi',programme:'Human Resource Management',year:'Year 2',status:'Pending',time:'—'}]};
const menus={student:[['overview','▦','Overview'],['courses','▤','My units'],['attendance','◷','Attendance history'],['profile','♙','My profile']],lecturer:[['overview','▦','Overview'],['sessions','＋','Class sessions'],['roster','☷','Attendance register'],['courses','▤','My units'],['profile','♙','My profile']]};
const titles={overview:'Overview',courses:'My units',attendance:'Attendance history',sessions:'Class sessions',roster:'Attendance register',profile:'My profile'};
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function go(p){S.page=p;$('sidebar').classList.remove('open');render()}
function setRole(r){S.role=r;S.page='overview';render()}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function stat(label,val,note,icon){return `<article class="stat"><div class="stathead">${label}<span class="staticon">${icon}</span></div><div class="number">${val}</div><div class="note">${note}</div></article>`}
function course(c){return `<article class="course"><div class="courseleft"><div class="coursecode">${c.code}</div><div><h3>${c.name}</h3><p>${c.lecturer} · ${c.year} · ${c.semester}</p><div class="progress"><span style="width:${c.attendance}%"></span></div></div></div><div style="text-align:right;flex-shrink:0"><span class="badge ${c.attendance>=85?'greenbg':c.attendance>=75?'amberbg':'graybg'}">${c.attendance}% attendance</span><p class="muted" style="font-size:10px;margin:7px 0 0">${c.present}/${c.total} classes</p></div></article>`}
function codeMarkup(){return `<div class="codebox"><span class="badge greenbg">SESSION ACTIVE</span><div class="code">${S.session.code}</div><div class="muted">${S.session.unit} · ${S.session.year} · ${S.session.semester}</div><p class="muted" style="font-size:11px">Share this code with students in your class.</p><button class="btn danger sm" onclick="endSession()">End session</button></div>`}
function studentOverview(){let avg=Math.round(S.courses.reduce((a,c)=>a+c.attendance,0)/S.courses.length);return `<div class="grid stats">${stat('Overall attendance',avg+'%','Across registered units','◷')}${stat('Registered units',S.courses.length,'Current semester','▤')}${stat('Classes attended',S.courses.reduce((a,c)=>a+c.present,0),'Recorded as present','✓')}${stat('Absences to review',S.records.filter(r=>r.status==='Absent').length,'In recent records','!')}</div><div class="grid cols"><div class="panel"><div class="head"><div><div class="ptitle">Attendance by unit</div><div class="sub">Current semester summary</div></div><button class="btn sm" onclick="go('courses')">View all units</button></div><div class="body"><div class="courses">${S.courses.map(course).join('')}</div><div class="footer">Sample data for demonstration only.</div></div></div><div class="panel"><div class="head"><div class="ptitle">Recent activity<div class="sub">Latest attendance updates</div></div></div><div class="body">${S.records.slice(0,4).map(r=>`<div class="activityrow"><div class="dot" style="background:${r.status==='Present'?'#16845b':'#d49a27'}"></div><div><strong>${r.status} · ${r.code}</strong><span>${r.unit} · ${r.date}</span></div></div>`).join('')}<button class="btn" style="width:100%;margin-top:12px" onclick="go('attendance')">View attendance history</button></div></div></div>`}
function lecturerOverview(){let n=S.students.filter(s=>s.status==='Present').length;return `<div class="grid stats">${stat('Units assigned',S.courses.length,'Current semester','▤')}${stat('Active session',S.session?'1':'0',S.session?'Session in progress':'No session running','◉')}${stat('Students marked',n,'In sample register','✓')}${stat('Pending verification',S.students.filter(s=>s.status==='Pending').length,'Awaiting confirmation','!')}</div><div class="grid cols"><div class="panel"><div class="head"><div><div class="ptitle">My teaching units</div><div class="sub">Units assigned to your lecturer account</div></div><button class="btn primary sm" onclick="go('sessions')">Start a session</button></div><div class="body"><div class="courses">${S.courses.map(course).join('')}</div></div></div><div class="panel"><div class="head"><div><div class="ptitle">Session control</div><div class="sub">Create an attendance session</div></div></div><div class="body">${S.session?codeMarkup():`<div class="notice">Choose a unit and create a temporary six-digit attendance code for your students.</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="go('sessions')">Configure class session</button>`}<button class="btn" style="width:100%;margin-top:10px" onclick="go('roster')">Open attendance register</button></div></div></div>`}
function coursesPage(){return `<div class="panel"><div class="head"><div><div class="ptitle">${S.role==='student'?'Registered units':'Teaching units'}</div><div class="sub">${S.role==='student'?'Units selected for the current semester':'Units assigned to your lecturer profile'}</div></div><span class="badge bluebg">${S.courses.length} units</span></div><div class="body"><div class="courses">${S.courses.map(course).join('')}</div></div></div>`}
function historyRows(rows){return rows.map(r=>`<tr><td>${r.date}</td><td><strong>${r.code}</strong><br><span class="muted">${r.unit}</span></td><td>${r.time}</td><td><span class="badge ${r.status==='Present'?'greenbg':r.status==='Absent'?'amberbg':'graybg'}">${r.status}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No records found.</td></tr>'}
function attendancePage(){return `<div class="panel"><div class="head"><div><div class="ptitle">Attendance history</div><div class="sub">Review recorded attendance by date and unit</div></div><button class="btn sm" onclick="exportHistory()">Export CSV</button></div><div class="body"><div class="field" style="max-width:240px;margin-bottom:15px"><label>Filter by status</label><select id="historyFilter" onchange="filterHistory()"><option>All</option><option>Present</option><option>Absent</option><option>Late</option></select></div><div class="tablewrap"><table id="historyTable"><thead><tr><th>Date</th><th>Unit</th><th>Time</th><th>Status</th></tr></thead><tbody>${historyRows(S.records)}</tbody></table></div></div></div>`}
function sessionsPage(){return `<div class="grid cols"><div class="panel"><div class="head"><div><div class="ptitle">Start a class session</div><div class="sub">Select the details for today's class</div></div></div><div class="body"><form id="sessionForm" class="formgrid"><div class="field full"><label>Teaching unit</label><select id="unitSelect" required>${S.courses.map(c=>`<option value="${c.code}">${c.code} — ${c.name}</option>`).join('')}</select></div><div class="field"><label>Programme</label><select id="programme"><option>Human Resource Management</option><option>Information Technology</option><option>Business Management</option><option>Education</option></select></div><div class="field"><label>Year of study</label><select id="yearSelect"><option>Year 1</option><option selected>Year 2</option><option>Year 3</option><option>Year 4</option></select></div><div class="field"><label>Semester</label><select id="semesterSelect"><option>Semester 1</option><option>Semester 2</option></select></div><div class="field"><label>Session duration</label><select id="duration"><option>30 minutes</option><option selected>60 minutes</option><option>90 minutes</option><option>120 minutes</option></select></div><div class="full"><button class="btn primary" type="submit">Generate attendance code</button></div></form><div class="footer">Prototype only. This code is generated in your browser, not verified by a server.</div></div></div><div class="panel"><div class="head"><div><div class="ptitle">Current session</div><div class="sub">Session status and access code</div></div></div><div class="body" id="sessionStatus">${S.session?codeMarkup():'<div class="empty">◷<p><strong>No active session</strong></p>Start a session to generate a temporary code.</div>'}</div></div></div>`}
function rosterPage(){return `<div class="panel"><div class="head"><div><div class="ptitle">Attendance register</div><div class="sub">Sample student roster for demonstration</div></div><div><button class="btn sm" onclick="exportRoster()">Export CSV</button> <button class="btn primary sm" onclick="addStudent()">Add demo student</button></div></div><div class="body"><div class="notice" style="margin-bottom:15px">This register is not connected to a university database. Changes are temporary and exist only in this browser session.</div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Admission number</th><th>Programme</th><th>Check-in time</th><th>Status</th><th>Action</th></tr></thead><tbody>${S.students.map((s,i)=>`<tr><td><strong>${s.name}</strong></td><td>${s.adm}</td><td>${s.programme}</td><td>${s.time}</td><td><span class="badge ${s.status==='Present'?'greenbg':'amberbg'}">${s.status}</span></td><td><button class="btn sm" onclick="toggleStudent(${i})">${s.status==='Present'?'Mark pending':'Confirm present'}</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function profilePage(){let student=S.role==='student';return `<div class="grid cols"><div class="panel"><div class="profile"><div class="profileicon">${student?'BO':'DO'}</div><div><h2>${student?'Brian Otieno':'David A. Otieno'}</h2><p>${student?'Student · RUC/2024/001':'Lecturer · Business & Technology'}</p><p>CampusAttend demonstration profile</p></div></div><div class="body"><form id="profileForm" class="formgrid"><div class="field full"><label>Full name</label><input value="${student?'Brian Otieno':'David A. Otieno'}" required></div><div class="field"><label>University email</label><input type="email" value="${student?'brian@example.edu':'d.otieno@example.edu'}" required></div><div class="field"><label>${student?'Programme':'Department'}</label><input value="${student?'Human Resource Management':'Business & Technology'}" required></div><div class="full"><button class="btn primary" type="submit">Save profile changes</button></div></form></div></div><div class="panel"><div class="head"><div class="ptitle">Account information</div></div><div class="body"><div class="activityrow"><div class="dot"></div><div><strong>Role</strong><span>${student?'Student':'Lecturer'}</span></div></div><div class="activityrow"><div class="dot"></div><div><strong>Academic year</strong><span>2026 / 2027</span></div></div><div class="activityrow"><div class="dot"></div><div><strong>Security</strong><span>Demo profile — authentication not configured</span></div></div><div class="notice" style="margin-top:15px">Do not use this prototype for real student records. Production use requires authenticated accounts and secure server-side storage.</div></div></div></div>`}
function render(){let student=S.role==='student';$('nav').innerHTML=menus[S.role].map(([id,ico,label])=>`<button class="${S.page===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('sideRole').textContent=student?'Student workspace':'Lecturer workspace';$('avatar').textContent=student?'BO':'DO';$('crumb').textContent=titles[S.page];$('pagetitle').textContent=titles[S.page];$('eyebrow').textContent=student?'STUDENT DASHBOARD':'LECTURER DASHBOARD';$('welcome').textContent=student?'Good morning, Brian':'Welcome back, David';$('welcomeText').textContent=student?'Track your attendance and stay up to date with your classes.':'Manage teaching units, run class sessions and review attendance.';$('date').textContent=new Date().toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$('sec-'+S.page).classList.add('active');let target=$('sec-'+S.page);if(S.page==='overview')target.innerHTML=student?studentOverview():lecturerOverview();if(S.page==='courses')target.innerHTML=coursesPage();if(S.page==='attendance')target.innerHTML=student?attendancePage():'<div class="panel"><div class="empty">Open the attendance register to review and manage class attendance.</div></div>';if(S.page==='sessions')target.innerHTML=sessionsPage();if(S.page==='roster')target.innerHTML=rosterPage();if(S.page==='profile')target.innerHTML=profilePage();let sf=$('sessionForm');if(sf)sf.onsubmit=startSession;let pf=$('profileForm');if(pf)pf.onsubmit=e=>{e.preventDefault();toast('Profile changes are preview-only in this demo.')}}
function startSession(e){e.preventDefault();let code=String(Math.floor(100000+Math.random()*900000)),unit=$('unitSelect').value,c=S.courses.find(x=>x.code===unit);S.session={code,unit:(c?c.name:unit),codeUnit:unit,year:$('yearSelect').value,semester:$('semesterSelect').value};render();toast('Demo session created. Code: '+code)}
function endSession(){S.session=null;render();toast('Demo session ended.')}
function toggleStudent(i){let s=S.students[i];s.status=s.status==='Present'?'Pending':'Present';if(s.status==='Present'&&s.time==='—')s.time=new Date().toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit',hour12:false});render();toast('Demo register updated.')}
function addStudent(){let n=S.students.length+1;S.students.push({adm:'RUC/2024/'+String(n).padStart(3,'0'),name:'Demo Student '+n,programme:'Human Resource Management',year:'Year 2',status:'Pending',time:'—'});render();toast('Demo student added.')}
function filterHistory(){let f=$('historyFilter').value;let rows=f==='All'?S.records:S.records.filter(x=>x.status===f);$('historyTable').querySelector('tbody').innerHTML=historyRows(rows)}
function download(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV file exported.')}
function exportHistory(){download('campusattend-history.csv',[['Date','Unit code','Unit','Time','Status'],...S.records.map(r=>[r.date,r.code,r.unit,r.time,r.status])])}
function exportRoster(){download('campusattend-register.csv',[['Name','Admission number','Programme','Year','Time','Status'],...S.students.map(s=>[s.name,s.adm,s.programme,s.year,s.time,s.status])])}
$('role').onchange=e=>setRole(e.target.value);$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');document.addEventListener('click',e=>{if(innerWidth<=680&&!e.target.closest('#sidebar')&&!e.target.closest('#menuBtn'))$('sidebar').classList.remove('open')});render();
</script></body></html>
